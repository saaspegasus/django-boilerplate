{% load i18n %}
<section class="bg-base-200">
  <div class="mx-auto grid max-w-7xl gap-12 px-6 py-16 sm:py-24 lg:grid-cols-2 lg:gap-16 lg:px-8">
    <figure>
      <blockquote class="text-xl leading-relaxed text-pretty text-base-content sm:text-2xl">
        <p>
          {% blocktranslate trimmed %}
            “We moved our whole team over in an afternoon. A month later, our weekly status meeting is fifteen minutes instead of an hour.”
          {% endblocktranslate %}
        </p>
      </blockquote>
      <figcaption class="mt-8 flex items-center gap-4">
        <div class="avatar avatar-placeholder">
          <div class="w-12 rounded-full bg-primary text-primary-content">
            <span>AH</span>
          </div>
        </div>
        <div>
          <div class="font-semibold text-base-content">Alice Hayley</div>
          <div class="text-sm text-base-content/70">{% translate "Operations lead, Company X" %}</div>
        </div>
      </figcaption>
    </figure>
    <figure>
      <blockquote class="text-xl leading-relaxed text-pretty text-base-content sm:text-2xl">
        <p>
          {% blocktranslate trimmed %}
            “It does the handful of things we need really well, and stays out of the way the rest of the time.”
          {% endblocktranslate %}
        </p>
      </blockquote>
      <figcaption class="mt-8 flex items-center gap-4">
        <div class="avatar avatar-placeholder">
          <div class="w-12 rounded-full bg-secondary text-secondary-content">
            <span>BH</span>
          </div>
        </div>
        <div>
          <div class="font-semibold text-base-content">Bob Herberts</div>
          <div class="text-sm text-base-content/70">{% translate "Founder, Company Y" %}</div>
        </div>
      </figcaption>
    </figure>
  </div>
</section>
