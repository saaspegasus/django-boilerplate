{% comment %}
  A theme-colored sketch of an app screen, shown under the hero.
  Replace the contents of the inner panel with a screenshot of your product, e.g.:
  {% load static %}
  <img src="{% static 'images/web/screenshot.png' %}" alt="..." class="w-full">
{% endcomment %}
<div class="mockup-browser border border-base-content/10 bg-base-100 shadow-2xl shadow-primary/20" aria-hidden="true">
  <div class="mockup-browser-toolbar"></div>
  <div class="grid border-t border-base-content/10 md:grid-cols-[13rem_1fr]">
    <div class="hidden space-y-3 border-e border-base-content/10 p-5 md:block">
      <div class="h-3 w-24 rounded-full bg-primary/70"></div>
      <div class="pt-3"></div>
      <div class="h-2.5 w-32 rounded-full bg-base-content/10"></div>
      <div class="h-2.5 w-28 rounded-full bg-base-content/10"></div>
      <div class="h-2.5 w-36 rounded-full bg-base-content/10"></div>
      <div class="h-2.5 w-24 rounded-full bg-base-content/10"></div>
    </div>
    <div class="space-y-5 p-5 sm:p-8">
      <div class="grid grid-cols-3 gap-3 sm:gap-5">
        <div class="rounded-box border border-base-content/10 p-4">
          <div class="h-2 w-12 rounded-full bg-base-content/10"></div>
          <div class="mt-3 h-5 w-16 rounded-full bg-base-content/40"></div>
        </div>
        <div class="rounded-box border border-base-content/10 p-4">
          <div class="h-2 w-10 rounded-full bg-base-content/10"></div>
          <div class="mt-3 h-5 w-20 rounded-full bg-base-content/40"></div>
        </div>
        <div class="rounded-box border border-base-content/10 p-4">
          <div class="h-2 w-14 rounded-full bg-base-content/10"></div>
          <div class="mt-3 h-5 w-12 rounded-full bg-secondary"></div>
        </div>
      </div>
      <div class="flex h-36 items-end gap-2 rounded-box border border-base-content/10 p-4 sm:h-48 sm:gap-3">
        <div class="h-1/3 flex-1 rounded-t-field bg-primary/40"></div>
        <div class="h-1/2 flex-1 rounded-t-field bg-primary/40"></div>
        <div class="h-2/5 flex-1 rounded-t-field bg-primary/40"></div>
        <div class="h-2/3 flex-1 rounded-t-field bg-primary/40"></div>
        <div class="h-3/5 flex-1 rounded-t-field bg-primary/40"></div>
        <div class="h-4/5 flex-1 rounded-t-field bg-primary/40"></div>
        <div class="h-3/4 flex-1 rounded-t-field bg-primary/40"></div>
        <div class="h-full flex-1 rounded-t-field bg-primary"></div>
      </div>
      <div class="hidden space-y-3 sm:block">
        <div class="flex items-center gap-3">
          <div class="size-6 rounded-full bg-base-content/10"></div>
          <div class="h-2.5 w-1/3 rounded-full bg-base-content/10"></div>
          <div class="ms-auto h-2.5 w-16 rounded-full bg-success/60"></div>
        </div>
        <div class="flex items-center gap-3">
          <div class="size-6 rounded-full bg-base-content/10"></div>
          <div class="h-2.5 w-1/4 rounded-full bg-base-content/10"></div>
          <div class="ms-auto h-2.5 w-12 rounded-full bg-warning/60"></div>
        </div>
      </div>
    </div>
  </div>
</div>
